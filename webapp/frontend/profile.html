<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Profile &middot; Netflix</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="page-loader" id="page-loader">
    <i data-lucide="clapperboard" class="logo-icon spin-slow"></i>
    <div>Loading profile&hellip;</div>
  </div>

  <div class="app-shell" id="app-shell" style="display:none;">
    <div id="sidebar-root"></div>

    <main class="main-content">
      <div class="page-hero">
        <h1><i data-lucide="user" class="hero-icon"></i> Your Profile</h1>
        <p>Your favorites, ratings, and taste at a glance.</p>
      </div>

      <div class="stat-grid" id="stat-grid"></div>

      <div class="section glass">
        <h2><i data-lucide="target"></i> Current Preferences</h2>
        <div id="preferences-list"></div>
      </div>

      <div class="section glass">
        <h2><i data-lucide="bookmark"></i> Favorites</h2>
        <div id="favorites-list"></div>
      </div>

      <div class="section glass">
        <h2><i data-lucide="star"></i> Your Ratings</h2>
        <div id="ratings-list"></div>
      </div>
    </main>
  </div>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Settings &middot; Netflix</title>
<link rel="stylesheet" href="/css/style.css">
<script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="page-loader" id="page-loader">
    <i data-lucide="clapperboard" class="logo-icon spin-slow"></i>
    <div>Loading settings&hellip;</div>
  </div>

  <div class="app-shell" id="app-shell" style="display:none;">
    <div id="sidebar-root"></div>

    <main class="main-content">
      <div class="page-hero">
        <h1><i data-lucide="settings" class="hero-icon"></i> Settings</h1>
        <p>Manage your account and preferences.</p>
      </div>

      <div class="section glass">
        <h2><i data-lucide="lock"></i> Change Password</h2>
        <form id="password-form" novalidate>
          <div class="field">
            <label for="current-password">Current password</label>
            <input id="current-password" type="password" autocomplete="current-password" required>
          </div>
          <div class="field">
            <label for="new-password">New password</label>
            <input id="new-password" type="password" autocomplete="new-password" required minlength="6">
          </div>
          <div class="field">
            <label for="confirm-password">Confirm new password</label>
            <input id="confirm-password" type="password" autocomplete="new-password" required minlength="6">
          </div>
          <div class="field-error" id="password-error"></div>
          <button type="submit" class="btn btn-primary" id="password-submit">Update Password</button>
        </form>
      </div>

      <div class="section glass">
        <h2><i data-lucide="palette"></i> Appearance &amp; Notifications</h2>
        <div class="toggle-row">
          <div>
            <div>Compact message bubbles</div>
          </div>
          <label class="switch"><input type="checkbox" id="toggle-compact"><span class="slider-toggle"></span></label>
        </div>
        <div class="toggle-row">
          <div>
            <div>Sound on new reply</div>
          </div>
          <label class="switch"><input type="checkbox" id="toggle-sound"><span class="slider-toggle"></span></label>
        </div>
        <div class="toggle-row">
          <div>
            <div>Auto-scroll chat</div>
          </div>
          <label class="switch"><input type="checkbox" id="toggle-autoscroll" checked><span class="slider-toggle"></span></label>
        </div>
      </div>

      <div class="section glass">
        <h2><i data-lucide="message-square"></i> Feedback</h2>
        <div class="field">
          <label for="satisfaction">How satisfied are you with recommendations? (1-5)</label>
          <select id="satisfaction">
            <option value="5">5 — Excellent</option>
            <option value="4">4 — Good</option>
            <option value="3" selected>3 — Okay</option>
            <option value="2">2 — Poor</option>
            <option value="1">1 — Very poor</option>
          </select>
        </div>
        <div class="field">
          <label for="comment">Anything to add? (optional)</label>
          <textarea id="comment" rows="3"></textarea>
        </div>
        <button class="btn btn-primary" id="feedback-submit">Submit Feedback</button>
      </div>
    </main>
  </div>

  <script src="/js/toast.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/shell.js"></script>
  <script src="/js/settings.js"></script>
</body>
</html>
